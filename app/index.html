<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swap</title>
<meta name="description" content="Swap: food and ride spending, by week, with one cheaper swap.">
<meta name="theme-color" content="#f6f5f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="core.css">
</head>
<body>
<div class="stage">
  <aside class="panel">
    <h1><img src="icons/icon.svg" width="44" height="44" alt="">Swap</h1>
    <p class="lede">Food and ride spending, by week. One cheaper swap. Never blocks apps.</p>
    <h2 id="seg-h">Whose week</h2>
    <div class="seg" role="radiogroup" aria-labelledby="seg-h"></div>
    <h2>Features</h2>
    <ul class="feature-list"></ul>
    <div class="install"><div id="qr" class="qr" role="img" aria-label="QR code for michaelwang.lol/swap/app"></div><span>Scan, then Share → Add to Home Screen.<br><b>michaelwang.lol/swap/app</b></span></div>
    <p class="fine"><span data-fine>Meal plan and Weekend are sample students.</span> <a href="https://github.com/jialewang0528-gif/swap">Case study</a> · <button class="linkish" data-reset>Reset demo</button></p>
  </aside>
  <div class="device">
    <div class="island" aria-hidden="true"></div>
    <div class="statusbar" aria-hidden="true"><span>9:41</span><span>
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" style="margin-left:6px"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2"/></svg></span></div>
    <div class="app" id="app"></div>
    <div class="homebar" aria-hidden="true"></div>
  </div>
</div>

<script src="private/live.js" onerror="this.remove()"></script>
<script src="private/cloud-config.js" onerror="this.remove()"></script>
<script src="cloud.js"></script>
<script src="category.js"></script>
<script src="private/subscriptions.js" onerror="this.remove()"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="ai.js"></script>
<script src="features.js"></script>
<script>
  // Load every feature's CSS and JS in parallel; scripts still run in list order (async = false).
  (async () => {
    const loads = [];
    for (const id of self.SWAP_FEATURES) {
      const css = document.createElement("link"); css.rel = "stylesheet"; css.href = `features/${id}.css`;
      loads.push(new Promise(res => { css.onload = res; css.onerror = () => { css.remove(); res(); }; }));
      document.head.appendChild(css);
      const s = document.createElement("script"); s.src = `features/${id}.js`; s.async = false;
      loads.push(new Promise(res => { s.onload = res; s.onerror = () => { console.warn("[swap] missing feature", id); res(); }; }));
      document.body.appendChild(s);
    }
    await Promise.all(loads);
    Swap.start();
  })();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  // QR for the desktop panel only (the panel is hidden in the phone layout).
  if (!matchMedia("(max-width: 640px), (display-mode: standalone), (hover: none) and (pointer: coarse)").matches) {
    const q = document.createElement("script");
    q.src = "vendor/qrcode.min.js";
    q.onload = () => new QRCode(document.getElementById("qr"), { text: "https://michaelwang.lol/swap/app/", width: 84, height: 84, colorDark: "#14162a", colorLight: "#ffffff" });
    document.body.appendChild(q);
  }
</script>
</body>
</html>
